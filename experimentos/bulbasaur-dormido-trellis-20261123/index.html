<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bulbasaur 3D — TRELLIS</title><script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script><style>html,body{margin:0;height:100%;background:#152b29;color:#fff;font-family:system-ui}model-viewer{width:100%;height:100%;--poster-color:#152b29}header{position:absolute;left:15px;top:14px;pointer-events:none}h1{margin:0;font-size:21px}small{color:#b7e4d2}nav{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px;white-space:nowrap}button,a{background:#284d46;border:1px solid #76b2a0;color:white;border-radius:12px;padding:12px;text-decoration:none;font:14px system-ui}#status{position:absolute;top:43%;width:100%;text-align:center;pointer-events:none}</style></head><body><model-viewer id="m" src="./modelo.glb" camera-controls auto-rotate interaction-prompt="none" shadow-intensity=".8" exposure="1.1" camera-orbit="0deg 70deg auto" touch-action="none" alt="Modelo tridimensional de Bulbasaur dormido generado con TRELLIS"></model-viewer><header><h1>Bulbasaur dormido · 360°</h1><small>Malla TRELLIS · Arrastrá para girar y pellizcá para acercar</small></header><div id="status">Cargando modelo 3D…</div><nav><button id="spin">⏸ Pausar</button><button id="reset">Restablecer</button><a href="./modelo.glb" download>GLB</a></nav><script>const m=document.getElementById('m'),s=document.getElementById('status'),b=document.getElementById('spin');m.addEventListener('load',()=>s.hidden=true);m.addEventListener('error',()=>s.textContent='No se pudo cargar el modelo 3D.');b.onclick=()=>{m.autoRotate=!m.autoRotate;b.textContent=m.autoRotate?'⏸ Pausar':'▶ Girar'};document.getElementById('reset').onclick=()=>{m.cameraOrbit='0deg 70deg auto';m.cameraTarget='auto auto auto';m.fieldOfView='auto';m.jumpCameraToGoal()};</script></body></html>
