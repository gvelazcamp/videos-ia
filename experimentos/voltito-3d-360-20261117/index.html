<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#0b1c27"><title>Voltito 360° — visor interactivo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1822;color:#eaf8f6}
.stage{width:100%;max-width:880px;margin:0 auto;background:radial-gradient(ellipse at 52% 45%,#234d5b,#0b2835 60%,#07151f);border:1px solid #376474;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px #0002}
.header{display:flex;justify-content:space-between;gap:12px;padding:17px 20px 0;align-items:flex-start}
.brand{font-weight:850;font-size:26px;letter-spacing:.09em;color:#fff3c5;line-height:1}.subtitle{font-size:12px;letter-spacing:.06em;color:#a0c9cf;margin-top:7px}.tag{font-size:11px;border:1px solid #5faea0;color:#caffee;border-radius:20px;padding:7px 11px;background:#15505a55}
.viewer{position:relative;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none} .viewer.dragging{cursor:grabbing}
canvas{display:block;width:100%;height:min(64vh,520px);min-height:310px;touch-action:none}.help{font-size:12px;text-align:center;margin:-4px 0 14px;color:#b6d3d4}
.controls{border-top:1px solid #315560;background:#0e2632;display:flex;gap:13px;align-items:center;padding:14px 16px 18px;flex-wrap:wrap}
.controls input[type=range]{flex:1;min-width:130px;accent-color:#4bdcca;cursor:pointer;height:32px}.degree{font-variant-numeric:tabular-nums;min-width:42px;color:#fff1bb;font-weight:800;text-align:right}button{font:600 13px system-ui,sans-serif;border:1px solid #4a9995;border-radius:9px;color:#e3fffb;background:#194650;padding:10px 13px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid #bfffee;outline-offset:2px}.foot{font-size:11px;text-align:center;color:#7099a4;padding:10px 0 16px}
@media(max-width:500px){.header{padding:14px 15px 0}.brand{font-size:23px}.tag{font-size:10px}.controls{gap:10px;padding:10px 11px}.controls input[type=range]{min-width:100px}button{padding:9px 11px}.help{font-size:11px}}
</style></head><body>
<main class="stage"><header class="header"><div><div class="brand">VOLTITO</div><div class="subtitle">Personaje original · Vista 3D interactiva</div></div><div class="tag">360° · Sin Remove.bg</div></header>
<div id="viewer" class="viewer"><canvas id="voltito" aria-label="Voltito giratorio: arrastrá horizontalmente con el dedo"></canvas><div class="help">Deslizá el dedo sobre Voltito para girarlo</div></div>
<div class="controls"><input aria-label="Girarlo a un ángulo" id="angle" type="range" min="0" max="360" step="1" value="0"><output class="degree" id="deg">0°</output><button id="spin" type="button">▶ Girar</button><button id="home" type="button">Frente</button></div><div class="foot">Modelo volumétrico aproximado a partir de las cuatro vistas originales. Funciona sin WebGL ni imágenes externas.</div></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('voltito'),view=document.getElementById('viewer'),ctx=canvas.getContext('2d',{alpha:false}),slider=document.getElementById('angle'),out=document.getElementById('deg'),spin=document.getElementById('spin'),home=document.getElementById('home');
if(!ctx){view.insertAdjacentHTML('beforeend','<p style="text-align:center;padding:70px">Tu navegador no admite el visor 2D.</p>');return}
let yaw=0,pitch=-.05,auto=false,drag=false,lastX=0,lastY=0,lastTs=0;
const P={gold:'#FFCC61',head:'#FFD870',light:'#FFF0A6',cream:'#FFF6D0',outline:'#35444C',teal:'#29DAC8',tealDark:'#168F95',eye:'#223D58',brown:'#BD8141',nose:'#805356',white:'#FFFFFF'};
const rad=Math.PI/180;
function rot(p){let [x,y,z]=p;const co=Math.cos(yaw),si=Math.sin(yaw);let X=x*co+z*si,Z=-x*si+z*co;const cp=Math.cos(pitch),sp=Math.sin(pitch);return [X,y*cp-Z*sp,y*sp+Z*cp]}
function proj(p,S,CX,CY){let [x,y,z]=rot(p);let perspective=1+z*.065;return [CX+x*S*perspective,CY-y*S*perspective,z,perspective]}
function drawEllipse(cx,cy,rx,ry,col,stroke=3){const grad=ctx.createRadialGradient(cx-rx*.30,cy-ry*.42,ry*.05,cx,cy,Math.max(rx,ry)*1.24);grad.addColorStop(0,lighten(col,.28));grad.addColorStop(.45,col);grad.addColorStop(1,darken(col,.20));ctx.fillStyle=grad;ctx.strokeStyle=P.outline;ctx.lineWidth=stroke;ctx.beginPath();ctx.ellipse(cx,cy,Math.max(2,rx),Math.max(2,ry),0,0,Math.PI*2);ctx.fill();if(stroke)ctx.stroke()}
function parseRGB(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
function colorRGB(v){return '#'+v.map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('')}
function lighten(c,f){return colorRGB(parseRGB(c).map(x=>x+(255-x)*f))}
function darken(c,f){return colorRGB(parseRGB(c).map(x=>x*(1-f)))}
function strokePath(points,width,col,outline=0,S=1,CX=0,CY=0){let xy=points.map(p=>proj(p,S,CX,CY));ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();xy.forEach((p,i)=>{if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1])});if(outline){ctx.lineWidth=width+outline*2;ctx.strokeStyle=P.outline;ctx.stroke()}ctx.lineWidth=width;ctx.strokeStyle=col;ctx.stroke()}
function polygon(points,fill,S,CX,CY,stroke=3){let p=points.map(q=>proj(q,S,CX,CY));ctx.beginPath();p.forEach((v,i)=>{if(i)ctx.lineTo(v[0],v[1]);else ctx.moveTo(v[0],v[1])});ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle=P.outline;ctx.stroke()}}
function makeScene(w,h){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,w,h);let grad=ctx.createLinearGradient(0,0,w,h);grad.addColorStop(0,'#204E5C');grad.addColorStop(.6,'#10313E');grad.addColorStop(1,'#0D202F');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
ctx.fillStyle='#59EDCD14';for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(w*(.12+i*.115),h*(.17+(i%3)*.17),10+i*6,0,Math.PI*2);ctx.fill()}
const S=Math.min(w*.24,h*.16),CX=w*.50,CY=h*.57;let flo=proj([0,-1.48,0],S,CX,CY);ctx.fillStyle='#00141F66';ctx.beginPath();ctx.ellipse(flo[0],flo[1]+S*.17,S*1.05,S*.17,0,0,Math.PI*2);ctx.fill();
let things=[];function addSphere(pos,dim,col,name,stroke=3){let r=rot(pos);things.push({name,z:r[2],draw(){let c=proj(pos,S,CX,CY);let horizontal=Math.hypot(dim[0]*Math.cos(yaw),dim[2]*Math.sin(yaw));drawEllipse(c[0],c[1],S*horizontal*c[3],S*dim[1]*c[3],col,stroke)}})}
function addPoly(pts,col,name,stroke=3){let z=pts.reduce((s,p)=>s+rot(p)[2],0)/pts.length;things.push({name,z,draw(){polygon(pts,col,S,CX,CY,stroke)}})}
function addLine(pts,width,col,name,outline=2){let z=pts.reduce((s,p)=>s+rot(p)[2],0)/pts.length;things.push({name,z,draw(){strokePath(pts,width*S,col,outline,S,CX,CY)}})}
// Cola bifurcada: segmentos con grosor, siempre detrás del torso mirando de frente.
const tail=[[.50,-.72,-.42],[.92,-.48,-.54],[.83,-.19,-.57],[1.44,.38,-.59],[1.24,-.08,-.60],[1.72,-.10,-.59]];
addLine(tail,.15,P.teal,'cola',2.3);addLine([[1.44,.38,-.59],[1.72,.50,-.58]],.125,P.teal,'punta',2);
// Orejas de hoja, inclinadas y con punta turquesa.
for(let s of [-1,1]){
 let root=[s*.62,1.70,-.03],bend=[s*(s===-1?1.01:.98),2.33,-.07],tip=[s*(s===-1?1.25:1.42),2.92,-.10];
 addLine([root,bend,tip],.255,P.gold,'oreja'+s,3);
 addLine([[s*(s===-1?1.12:1.20),2.70,-.08],tip],.19,P.teal,'oreja-punta'+s,1);
}
// Piernas, brazos, cuerpo y cabeza volumenados.
for(let s of [-1,1]){addSphere([s*.45,-1.35,.18],[.31,.24,.36],P.gold,'pie'+s);addSphere([s*.79,-.44,.00],[.23,.43,.26],P.gold,'brazo'+s)}
addSphere([0,-.45,0],[.75,.87,.58],P.gold,'cuerpo',4);
addSphere([0,-.45,.525],[.49,.60,.14],P.cream,'panza',1);
// Icono rayo frontal y franjas dorsales de marca propia.
addLine([[.03,-.21,.65],[.17,-.43,.66],[-.02,-.48,.66],[.1,-.75,.64]],.060,P.tealDark,'logo',0);
for(let s of [-1,1])addSphere([s*.42,-.25,-.55],[.23,.13,.05],P.brown,'raya-espalda'+s,0);
addSphere([0,1.10,0],[1.00,.84,.71],P.head,'cabeza',4);
for(const s of [-1,0,1]){addLine([[s*.24,1.77,.06],[s*.18,2.20+(s===0?.11:0),.06]],.10,P.teal,'copete'+s,1.7)}
for(let s of [-1,1]){
 addSphere([s*.42,1.20,.64],[.165,.22,.07],P.eye,'ojo'+s,1);
 addSphere([s*.45-.04,1.29,.704],[.050,.073,.03],P.white,'brillo'+s,0);
 addSphere([s*.76,.84,.50],[.16,.16,.09],P.teal,'mejilla'+s,1.5);
}
addSphere([0,.92,.703],[.070,.055,.036],P.nose,'nariz',0);
addLine([[-.14,.76,.688],[0,.72,.713],[.14,.76,.688]],.023,P.nose,'sonrisa',0);
// Marcas posteriores visibles al girar.
addSphere([0,1.10,-.687],[.28,.17,.050],P.brown,'nuca',0);
things.sort((a,b)=>a.z-b.z);for(let t of things)t.draw();
// Brillos decorativos laterales, siempre fuera de las patas.
ctx.fillStyle='#7BEED788';for(let i=0;i<4;i++){let x=CX+Math.sin(i*1.57+yaw)*S*1.83, y=CY-S*.1+i*24;ctx.beginPath();ctx.arc(x,y,1.8+i*.15,0,Math.PI*2);ctx.fill()}
}
function setYaw(deg){yaw=((deg%360)+360)%360*rad;slider.value=String(Math.round(((deg%360)+360)%360));out.textContent=slider.value+'°';render()}
function render(){let dpr=Math.min(devicePixelRatio||1,2), rect=canvas.getBoundingClientRect();let w=Math.max(250,Math.floor(rect.width*dpr)),h=Math.max(290,Math.floor(rect.height*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}makeScene(w,h)}
view.addEventListener('pointerdown',e=>{if(e.target!==canvas)return;drag=true;auto=false;spin.textContent='▶ Girar';lastX=e.clientX;lastY=e.clientY;view.classList.add('dragging');canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;pitch=Math.max(-.20,Math.min(.22,pitch+dy*.0008));setYaw(yaw/rad+dx*.65)});
canvas.addEventListener('pointerup',()=>{drag=false;view.classList.remove('dragging')});canvas.addEventListener('pointercancel',()=>{drag=false;view.classList.remove('dragging')});
slider.addEventListener('input',()=>{auto=false;spin.textContent='▶ Girar';setYaw(+slider.value)});
spin.addEventListener('click',()=>{auto=!auto;spin.textContent=auto?'Ⅱ Pausar':'▶ Girar'});
home.addEventListener('click',()=>{auto=false;spin.textContent='▶ Girar';pitch=-.05;setYaw(0)});
function tick(t){if(auto&&lastTs)setYaw(yaw/rad+(t-lastTs)*.035);lastTs=t;requestAnimationFrame(tick)}
window.addEventListener('resize',render);setYaw(0);requestAnimationFrame(tick);
})();
</script></body></html>
