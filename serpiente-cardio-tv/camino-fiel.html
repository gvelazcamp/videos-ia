<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Camino de la Serpiente — recorrido 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#b96cb7;color:white;font-family:system-ui;overflow:hidden}canvas{display:block}#ui{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2}button,select{background:#17243cbf;border:1px solid #d7e4ff;color:white;padding:10px 13px;border-radius:10px;font-size:14px}#status{margin-left:auto;background:#17243caa;border-radius:10px;padding:10px}#note{position:fixed;bottom:12px;left:12px;background:#17243caa;padding:8px;border-radius:8px;font-size:12px}#error{position:fixed;inset:0;display:none;place-items:center;background:#19233d;padding:30px;text-align:center;z-index:10}</style></head><body><div id="ui"><button id="pause">Pausar</button><button id="view">Vista: corredor</button><label>Velocidad <select id="speed"><option value="7">Suave</option><option value="14" selected>Normal</option><option value="25">Rápida</option></select></label><span id="status">Recorrido 0 m</span></div><div id="note">Camino gris azulado · bordes triangulares · nubes doradas · cámara en movimiento</div><div id="error">No se pudo cargar el motor 3D. Abrí el enlace con conexión a Internet y un navegador actualizado.</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#d28ac5');scene.fog=new THREE.FogExp2('#dca5b1',.0015);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1600);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff6d2,0x8798bb,2.1));const sun=new THREE.DirectionalLight(0xffedb4,2.5);sun.position.set(-50,90,-80);scene.add(sun);
// The snake road follows a single continuous 3D centerline. Both the road and the camera use this exact function.
const roadY=29, width=10, maxT=1850, step=1.7;
function path(t){return new THREE.Vector3(29*Math.sin(t*.012)+14*Math.sin(t*.026),roadY+2.6*Math.sin(t*.015),-t)}
function frame(t){const a=path(t-.08),b=path(t+.08),tan=b.sub(a).normalize();const right=new THREE.Vector3(-tan.z,0,tan.x).normalize();return {p:path(t),tan,right}}
const top=[],uv=[],indices=[],sides=[],sideIndices=[],edgeVerts=[],edgeIdx=[];let n=0;
for(let t=0;t<=maxT;t+=step){const {p,right}=frame(t);for(const s of [-1,1]){const v=p.clone().addScaledVector(right,s*width/2);top.push(v.x,v.y,v.z);uv.push(s===-1?0:1,t*.1)}if(n>0){let k=2*(n-1);indices.push(k,k+1,k+2,k+1,k+3,k+2)}n++}
function mesh(pos,ind,material,uvs){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));if(uvs)g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));g.setIndex(ind);g.computeVertexNormals();return new THREE.Mesh(g,material)}
// Canvas-generated original tile texture: light blue-grey surface and thin stone seams.
const cv=document.createElement('canvas');cv.width=256;cv.height=256;const cx=cv.getContext('2d');cx.fillStyle='#c4d0d9';cx.fillRect(0,0,256,256);cx.strokeStyle='#8a9ead';cx.lineWidth=3;for(let y=0;y<256;y+=64){cx.beginPath();cx.moveTo(0,y);cx.lineTo(256,y);cx.stroke()}for(let y=0;y<256;y+=128){cx.beginPath();cx.moveTo(128,y);cx.lineTo(128,y+64);cx.stroke()}const tex=new THREE.CanvasTexture(cv);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(1,2);
const road=mesh(top,indices,new THREE.MeshStandardMaterial({map:tex,color:0xf5f8ff,roughness:.94,side:THREE.DoubleSide}),uv);scene.add(road);
// Deep blue scaled underside, so this is an elevated serpentine body rather than a flat floating ribbon.
const under=[],underIdx=[];let u=0;for(let t=0;t<=maxT;t+=step*2){const {p,right}=frame(t);for(let j=0;j<9;j++){const theta=Math.PI*j/8;const v=p.clone().addScaledVector(right,Math.cos(theta)*width/2);v.y-=Math.sin(theta)*5+.35;under.push(v.x,v.y,v.z)}if(u>0){for(let j=0;j<8;j++){const k=(u-1)*9+j;underIdx.push(k,k+1,k+9,k+1,k+10,k+9)}}u++}scene.add(mesh(under,underIdx,new THREE.MeshStandardMaterial({color:0x8399b0,roughness:.9,side:THREE.DoubleSide})));
// Distinctive triangular spines on BOTH edges, not a conventional green highway railing.
const spikeMaterial=new THREE.MeshStandardMaterial({color:0x8da2b5,side:THREE.DoubleSide,roughness:.8});const spikeGeo=new THREE.BufferGeometry();const spikePos=[],spikeInd=[];let si=0;for(let t=0;t<maxT-3;t+=4){for(const side of [-1,1]){const f=frame(t),f2=frame(t+3.7);const a=f.p.clone().addScaledVector(f.right,side*(width/2+.1));const b=f2.p.clone().addScaledVector(f2.right,side*(width/2+.1));const peak=a.clone().lerp(b,.48);peak.y+=2.6;for(const v of [a,b,peak])spikePos.push(v.x,v.y,v.z);spikeInd.push(si,si+1,si+2);si+=3}}spikeGeo.setAttribute('position',new THREE.Float32BufferAttribute(spikePos,3));spikeGeo.setIndex(spikeInd);spikeGeo.computeVertexNormals();scene.add(new THREE.Mesh(spikeGeo,spikeMaterial));
// Vast golden cloud sea: layered, overlapping soft cloud forms, never blue water or green land.
const cloudMats=[new THREE.MeshLambertMaterial({color:0xf8ce65,transparent:true,opacity:.93}),new THREE.MeshLambertMaterial({color:0xffdf8a,transparent:true,opacity:.93}),new THREE.MeshLambertMaterial({color:0xe9a83f,transparent:true,opacity:.87})];const sphere=new THREE.SphereGeometry(1,9,6);const rng=(i)=>{let x=Math.sin(i*127.1+4.71)*43758.5453;return x-Math.floor(x)};for(let i=0;i<1150;i++){const z=-rng(i*3+1)*1900,x=(rng(i*3+2)-.5)*550,y=5+rng(i*3+3)*5;const m=new THREE.Mesh(sphere,cloudMats[i%3]);m.position.set(x,y,z);m.scale.set(11+rng(i+5)*25,3+rng(i+6)*5,9+rng(i+7)*22);scene.add(m)}
let t=9,paused=false,high=false,last=performance.now();const status=document.querySelector('#status');document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Continuar':'Pausar'};document.querySelector('#view').onclick=e=>{high=!high;e.target.textContent='Vista: '+(high?'elevada':'corredor')};function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;if(!paused)t+=dt*Number(document.querySelector('#speed').value);if(t>maxT-100)t=10;const f=frame(t),look=frame(t+(high?70:24));const desired=f.p.clone().add(new THREE.Vector3(0,high?30:2.3,high?22:3));camera.position.lerp(desired,Math.min(1,dt*5));const target=look.p.clone().add(new THREE.Vector3(0,high?0:2,0));camera.lookAt(target);status.textContent='Recorrido '+Math.floor(t)+' m';renderer.render(scene,camera)}requestAnimationFrame(loop);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
