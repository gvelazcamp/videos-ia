const music=document.querySelector('#music'),musicToggle=document.querySelector('#musicToggle');let musicURL=null;
document.querySelector('#musicFile').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(musicURL)URL.revokeObjectURL(musicURL);musicURL=URL.createObjectURL(f);music.src=musicURL;musicToggle.disabled=false;musicToggle.textContent='♫ Pausar música';try{await music.play()}catch(err){musicToggle.textContent='♫ Reproducir música'}});
musicToggle.onclick=async()=>{if(music.paused){try{await music.play();musicToggle.textContent='♫ Pausar música'}catch(err){musicToggle.textContent='♫ Reproducir música'}}else{music.pause();musicToggle.textContent='♫ Reproducir música'}};
let zoom=1,t=9,distance=0,paused=false,high=false,last=performance.now(),rewarded=false,prizeUntil=0;
const status=document.querySelector('#status'),prize=document.querySelector('#prize');
const clampZoom=v=>Math.max(.6,Math.min(3.5,v));
document.querySelector('#zoomOut').onclick=()=>zoom=clampZoom(zoom*1.2);
document.querySelector('#zoomIn').onclick=()=>zoom=clampZoom(zoom/1.2);
let pinchStart=null,pinchZoom=1;
renderer.domElement.style.touchAction='none';document.body.style.touchAction='none';
document.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchZoom=zoom}},{passive:true});
document.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchStart){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom=clampZoom(pinchZoom*pinchStart/Math.max(1,d));e.preventDefault()}},{passive:false});
document.addEventListener('touchend',e=>{if(e.touches.length<2)pinchStart=null},{passive:true});
function showPrize(now){prize.classList.remove('active');void prize.offsetWidth;prize.classList.add('active');prizeUntil=now+5000}
document.querySelector('#test').onclick=()=>showPrize(performance.now());
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Continuar':'Pausar'};
document.querySelector('#view').onclick=e=>{high=!high;e.target.textContent='Vista: '+(high?'elevada':'corredor')};
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
if(!paused){const meters=dt*Number(document.querySelector('#speed').value);t+=meters;distance+=meters}
if(t>maxT-100)t=10;
if(distance>=1000&&!rewarded){rewarded=true;showPrize(now)}
if(prizeUntil&&now>prizeUntil){prize.classList.remove('active');prizeUntil=0}
const f=frame(t),look=frame(t+(high?70:24));
const selected=document.querySelector('#character').value;
for(const [runner,kind] of [[gokuRunner,'goku'],[vegetaRunner,'vegeta']]){
 runner.visible=false;const sprite=runnerSprites[kind==='goku'?0:1];sprite.visible=high&&selected===kind;if(sprite.visible){sprite.position.copy(f.p);sprite.position.y+=1.45+(paused?0:Math.sin(now*.016)*.07);sprite.material.rotation=(paused?0:Math.sin(now*.012)*.04)}
 if(runner.visible){
  runner.position.copy(f.p);runner.position.y+=.1;
  runner.rotation.y=Math.atan2(-f.tan.x,-f.tan.z);
  const stride=paused?0:Math.sin(now*.014);
  for(const limb of runner.userData.limbs){limb.leg.rotation.x=stride*limb.side*.55;limb.arm.rotation.x=-stride*limb.side*.65}
 }
}
const bob=high||paused?0:Math.sin(now*.016)*.09;
const desired=f.p.clone().add(new THREE.Vector3(0,high?30*zoom:1.7+bob,high?22*zoom:1.8*zoom));camera.fov=THREE.MathUtils.lerp(camera.fov,Math.min(105,75*zoom),Math.min(1,dt*9));camera.updateProjectionMatrix();
camera.position.lerp(desired,Math.min(1,dt*5));
const target=look.p.clone().add(new THREE.Vector3(0,high?0:1.65,0));camera.lookAt(target);
status.textContent=Math.floor(distance)+' m / 1 km';
renderer.render(scene,camera)}
requestAnimationFrame(loop);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
