<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Camino de la Serpiente — recorrido 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a18abf;font-family:Arial,sans-serif}canvas{display:block}#ui{position:fixed;top:12px;left:12px;color:#fff;background:#241d3c99;padding:12px 16px;border-radius:12px;z-index:2;font-weight:bold}#bar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}button{background:#fffdf2d9;color:#2a2344;border:0;border-radius:9px;padding:12px;font-weight:bold}#error{position:fixed;inset:0;display:none;place-items:center;color:white;background:#251e3d;padding:25px;text-align:center}</style></head><body><div id="ui">CAMINO DE LA SERPIENTE · 3D<br><small id="distance">Recorrido: 0 m</small></div><div id="bar"><button id="slower">− Velocidad</button><button id="pause">Pausar</button><button id="faster">+ Velocidad</button><button id="view">Vista: corredor</button></div><div id="error">No se pudo cargar el motor 3D. Abrí el enlace con conexión a internet.</div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a98abf');scene.fog=new THREE.FogExp2('#b69ec7',0.0016);
const camera=new THREE.PerspectiveCamera(77,innerWidth/innerHeight,.1,3000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff3d7,0x9382b4,2.2));const sun=new THREE.DirectionalLight(0xffeac4,2);sun.position.set(-200,250,-150);scene.add(sun);
const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness,side:THREE.DoubleSide});const roadMat=mat('#e1e5e7'),stripeMat=mat('#b6bec9'),sideMat=mat('#8299b2'),teethMat=mat('#c1cdd9'),gold=mat('#f4dc9a');
const total=25000;const curve=t=>new THREE.Vector3(135*Math.sin(t*.00135)+62*Math.sin(t*.0031), 14*Math.sin(t*.0011)+9*Math.sin(t*.0027),-t);const tangent=t=>curve(t+2).sub(curve(t-2)).normalize();const cross=t=>new THREE.Vector3(-tangent(t).z,0,tangent(t).x).normalize();
function strip(width,offset,yoffset,material){const pos=[],idx=[],step=5;for(let i=0;i<=total/step;i++){const t=i*step,c=curve(t),n=cross(t);for(let side of [-1,1]){const p=c.clone().addScaledVector(n,offset+side*width/2);pos.push(p.x,p.y+yoffset,p.z)}}for(let i=0;i<total/step;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();scene.add(new THREE.Mesh(g,material))}
strip(17,0,0,roadMat);strip(.38,-7.8,.09,stripeMat);strip(.38,7.8,.09,stripeMat);strip(1.4,-8.9,-1.1,sideMat);strip(1.4,8.9,-1.1,sideMat);
const toothGeo=new THREE.ConeGeometry(1.65,3.3,4);toothGeo.translate(0,1.65,0);const count=3600;const teeth=new THREE.InstancedMesh(toothGeo,teethMat,count);const dummy=new THREE.Object3D();for(let i=0;i<count;i++){const t=i*13.7+8;const c=curve(t),n=cross(t);const p=c.addScaledVector(n,(i%2===0?1:-1)*9.5);dummy.position.set(p.x,p.y-.15,p.z);dummy.rotation.y=Math.atan2(tangent(t).x,-tangent(t).z);dummy.updateMatrix();teeth.setMatrixAt(i,dummy.matrix)}scene.add(teeth);
// Continuous luminous cloud layer below the floating road.
const cloudBase=new THREE.Mesh(new THREE.PlaneGeometry(9000,29000),new THREE.MeshBasicMaterial({color:'#e9c968',side:THREE.DoubleSide}));cloudBase.rotation.x=-Math.PI/2;cloudBase.position.set(0,-65,-total/2);scene.add(cloudBase);
const cloudGeo=new THREE.SphereGeometry(1,7,5),cloudMat=new THREE.MeshLambertMaterial({color:'#ffe5a0',transparent:true,opacity:.75});const clouds=new THREE.InstancedMesh(cloudGeo,cloudMat,1500);for(let i=0;i<1500;i++){const t=Math.random()*total,x=(Math.random()-.5)*1200,y=-58+Math.random()*17,z=-t;dummy.position.set(x,y,z);dummy.scale.set(20+Math.random()*70,4+Math.random()*15,18+Math.random()*50);dummy.rotation.set(0,0,0);dummy.updateMatrix();clouds.setMatrixAt(i,dummy.matrix)}scene.add(clouds);
let progress=30,speed=24,paused=false,far=false,last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.08);last=now;if(!paused)progress=(progress+dt*speed)%(total-500);const t=progress,c=curve(t),dir=tangent(t),n=cross(t);const eye=c.clone().add(new THREE.Vector3(0,far?32:2.3,0)).addScaledVector(dir,far?-26:0);const ahead=curve(t+(far?110:90));camera.position.lerp(eye,Math.min(1,dt*7));const look=ahead.clone().add(new THREE.Vector3(0,far?1:1.6,0));camera.lookAt(look);renderer.render(scene,camera);document.getElementById('distance').textContent='Recorrido: '+Math.floor(progress)+' m · '+speed+' m/s'}requestAnimationFrame(animate);
document.getElementById('slower').onclick=()=>speed=Math.max(3,speed-5);document.getElementById('faster').onclick=()=>speed=Math.min(90,speed+5);document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Continuar':'Pausar'};document.getElementById('view').onclick=e=>{far=!far;e.target.textContent=far?'Vista: aérea':'Vista: corredor'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
