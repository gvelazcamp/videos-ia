<!doctype html><html><head><meta charset="utf-8"><title>El paraguas de cuatro cielos</title></head><body style="margin:0;background:#000">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timing2.js"></script><script src="txt.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1080,H=1920;
const IMG={},NOMBRES=['00-caratula','01-paraguas-magico','02-gota-medusa','03-paraguas-cerrado','04-cielo-medusas','05-cielo-jardin','06-cielo-ballena','07-cielo-cometas','08-rosa-cromatica','robot-chatgpt','robot-claude','robot-gemini','robot-grok'];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const TXT=window.TXT||[];
// tiempos de cada segmento
const T_=window.TIMING;const SEG=[];{let k=0;for(const n of T_.segw){SEG.push(T_.wt[k]);k+=n;}}
const DUR=T_.dur,FIN=1.6;window.TOTAL=DUR+FIN;
function segDe(t){let i=0;while(i+1<SEG.length&&t>=SEG[i+1])i++;return i;}
function finSeg(i){return i+1<SEG.length?SEG[i+1]:DUR+FIN;}
// imagen a pantalla completa con zoom (las imágenes tienen el mismo formato 9:16)
function foto(n,z,cx,cy,a=1,dx=0,dy=0){const im=IMG[n];const sw=im.width/z,sh=im.height/z;let sx=cx*im.width-sw/2,sy=cy*im.height-sh/2;sx=clamp(sx,0,im.width-sw);sy=clamp(sy,0,im.height-sh);ctx.globalAlpha=a;ctx.drawImage(im,sx,sy,sw,sh,dx,dy,W,H);ctx.globalAlpha=1;}
function robot(n,x,y,h,a=1,t=0){if(a<=0)return;const im=IMG['robot-'+n];const w=im.width*h/im.height;ctx.save();ctx.globalAlpha=clamp(a);ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=24;ctx.drawImage(im,x-w/2,y-h+Math.sin(t*3+x)*6,w,h);ctx.restore();}
function caja(txt,x,y,size,col='#fff',a=1,bg='rgba(20,30,10,.55)'){if(a<=0)return;ctx.save();ctx.globalAlpha=clamp(a);ctx.font=`900 ${size}px system-ui,sans-serif`;ctx.textAlign='center';const w=ctx.measureText(txt).width+size*.9;ctx.fillStyle=bg;const r=size*.4;ctx.beginPath();ctx.roundRect(x-w/2,y-size*1.05,w,size*1.5,r);ctx.fill();ctx.fillStyle=col;ctx.fillText(txt,x,y);ctx.restore();}
function subtitulo(s,a){if(!s||a<=0)return;ctx.save();ctx.globalAlpha=clamp(a);ctx.font='800 58px system-ui,sans-serif';ctx.textAlign='center';const pal=s.split(' ');const lin=[];let l='';for(const p of pal){const q=l?l+' '+p:p;if(ctx.measureText(q).width>900){lin.push(l);l=p;}else l=q;}lin.push(l);
  const y0=250;ctx.lineWidth=12;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineJoin='round';ctx.fillStyle='#fff';lin.forEach((t,k)=>{ctx.strokeText(t,W/2,y0+k*72);ctx.fillText(t,W/2,y0+k*72);});ctx.restore();}
let PART=[];function vapor(t,x0,x1,y,n=3){const r=Math.sin(t*999)*.5+.5;for(let k=0;k<n;k++)PART.push({x:lerp(x0,x1,Math.random()),y,vy:-60-Math.random()*80,vx:(Math.random()-.5)*30,r:20+Math.random()*40,v:0,max:3+Math.random()*2,tipo:'v'});}
function confeti(n){for(let k=0;k<n;k++)PART.push({x:Math.random()*W,y:-20,vy:200+Math.random()*250,vx:(Math.random()-.5)*120,r:10+Math.random()*10,v:0,max:5,tipo:'c',col:['#ffd34d','#2fb36b','#ff6b6b','#5ab0ff','#fff'][k%5],g:Math.random()*6});}
let tPrev=-1;
function particulas(t){const dt=tPrev<0||t<tPrev?0:t-tPrev;tPrev=t;PART=PART.filter(p=>{p.v+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.tipo==='v'){p.r+=dt*25;const a=.32*(1-p.v/p.max);ctx.fillStyle=`rgba(255,255,255,${Math.max(0,a)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.v*p.g);ctx.fillStyle=p.col;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();}return p.v<p.max&&p.y<H+50;});}
const BOT=['chatgpt','claude','gemini','grok'];
// --- tomas por segmento ---
function lluvia(t,a=.5,col='200,220,255'){ctx.save();ctx.strokeStyle=`rgba(${col},${a})`;ctx.lineWidth=2.5;for(let k=0;k<90;k++){const x=((k*137.7+t*90)%(W+200))-100,y=((k*391.3+t*1900)%(H+200))-100;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-12,y+48);ctx.stroke();}ctx.restore();}
function brillo(x,y,r,a,col='255,240,200'){if(a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function semillas(t,n,col){for(let k=0;k<n;k++){const x=(k*211.3)%W,y=H*.15+((k*97.1+Math.sin(t*.7+k)*160+t*(k%2?40:-40))%(H*.6)+H*.6)%(H*.6);brillo(x,y,16+k%5*4,.55+.4*Math.sin(t*3+k),col);}}
function burbuja2(s,x,y,a){caja(s,x,y,52,'#fff',a,'rgba(30,30,50,.8)');}
const P=(n,z0,z1,cx0,cx1,cy0,cy1,p)=>foto(n,lerp(z0,z1,ease(p)),lerp(cx0,cx1,ease(p)),lerp(cy0,cy1,ease(p)));
function fila(t,a,h=300,y=1840){BOT.forEach((n,k)=>robot(n,165+k*250,y,h,a,t+k));}
function toma(i,p,t){
  switch(i){
  case 0:{const T0=SEG[0];const lt=t-T0;if(lt<1.0){foto('03-paraguas-cerrado',2.2,.33,.62);const gy=lerp(-40,1060,clamp(lt/.8));brillo(560,gy,40,.9,'200,230,255');ctx.fillStyle='#e8f6ff';ctx.beginPath();ctx.ellipse(560,gy,10,16,0,0,7);ctx.fill();if(lt>.8){ctx.fillStyle=`rgba(200,170,255,${1-(lt-.8)/.2})`;ctx.fillRect(0,0,W,H);}}else{foto('02-gota-medusa',lerp(1.25,1.1,clamp((lt-1)/3)),.45,.4);if(lt<1.3){ctx.fillStyle=`rgba(220,200,255,${1-(lt-1)/.3})`;ctx.fillRect(0,0,W,H);}}semillas(t,6,'180,200,255');break;}
  case 1: P('02-gota-medusa',1.1,1.35,.45,.5,.4,.35,p);semillas(t,8,'180,200,255');break;
  case 2: P('03-paraguas-cerrado',1.0,1.12,.5,.55,.55,.45,p);lluvia(t);break;
  case 3: foto('03-paraguas-cerrado',1.12,.55,.45);lluvia(t);BOT.forEach((n,k)=>robot(n,lerp(1250+k*230,640+k*110,ease(clamp(p*1.4))),1800,220,1,t+k));break;
  case 4: P('03-paraguas-cerrado',1.12,1.9,.55,.28,.45,.6,p);lluvia(t,.4);break;
  case 5: foto('03-paraguas-cerrado',lerp(1.9,2.3,p),.27,.62);brillo(W*.52,H*.56,120+40*Math.sin(t*5),.75,'200,180,255');lluvia(t,.35);break;
  case 6: foto('03-paraguas-cerrado',1.5,.35,.55);lluvia(t,.4);fila(t,1,260);burbuja2('Seguro está roto 🙄',760,1320,clamp(p*4));burbuja2('Abrilo con cuidado',330,1460,clamp((p-.45)*4));break;
  case 7: P('01-paraguas-magico',1.35,1.05,.5,.5,.45,.5,p);lluvia(t,.3);break;
  case 8: P('04-cielo-medusas',1.4,1.2,.5,.5,.6,.5,p);robot('chatgpt',230,1840,330,clamp(p*4),t);caja('Panel 1',540,1500,56,'#fff',clamp(p*3),'rgba(43,150,110,.85)');break;
  case 9: P('04-cielo-medusas',1.2,1.45,.5,.55,.5,.35,p);semillas(t,8,'170,190,255');break;
  case 10: P('04-cielo-medusas',1.45,1.15,.55,.5,.35,.62,p);lluvia(t,.35);break;
  case 11: P('05-cielo-jardin',1.4,1.2,.5,.5,.62,.5,p);robot('claude',230,1840,330,clamp(p*4),t);caja('Panel 2',540,1500,56,'#fff',clamp(p*3),'rgba(200,100,40,.85)');break;
  case 12: P('05-cielo-jardin',1.2,1.4,.5,.45,.5,.3,p);semillas(t,14,'255,240,180');break;
  case 13: foto('05-cielo-jardin',lerp(1.4,1.8,p),.5,.42);brillo(540,800,140+30*Math.sin(t*2),.6,'255,240,180');robot('claude',230,1840,330,1,t);break;
  case 14: P('06-cielo-ballena',1.4,1.2,.5,.5,.6,.5,p);robot('gemini',230,1840,330,clamp(p*4),t);caja('Panel 3',540,1500,56,'#fff',clamp(p*3),'rgba(60,90,200,.85)');break;
  case 15: P('06-cielo-ballena',1.5,1.5,.32,.68,.32,.32,p);semillas(t,6,'255,220,240');break;
  case 16: P('06-cielo-ballena',1.5,1.15,.68,.5,.32,.6,p);break;
  case 17: foto('06-cielo-ballena',1.15,.5,.6);robot('grok',W-230,1840,330,clamp(p*4),t);burbuja2('…',W-300,1430,clamp((p-.3)*4));break;
  case 18: P('07-cielo-cometas',1.4,1.2,.5,.5,.6,.5,p);robot('grok',W-230,1840,330,1,t);caja('Panel 4',540,1500,56,'#fff',clamp(p*3),'rgba(120,120,130,.85)');break;
  case 19: P('07-cielo-cometas',1.2,1.5,.5,.6,.5,.28,p);break;
  case 20: foto('07-cielo-cometas',1.15,.5,.55);fila(t,clamp(p*4),280);break;
  case 21: P('08-rosa-cromatica',2.0,1.4,.5,.5,.3,.4,p);fila(t,1,280);break;
  case 22: P('08-rosa-cromatica',1.4,1.05,.5,.5,.4,.5,p);brillo(540,560,420,.25*Math.sin(p*3.14),'255,220,255');break;
  case 23: foto('08-rosa-cromatica',lerp(1.05,1.15,p),.5,.5);lluvia(t,.55,'255,210,250');semillas(t,8,'255,230,200');break;
  case 24: P('01-paraguas-magico',1.6,1.25,.85,.75,.45,.5,p);lluvia(t,.3);break;
  case 25: P('01-paraguas-magico',1.25,1.05,.5,.5,.5,.5,p);break;
  case 26: P('08-rosa-cromatica',1.3,1.6,.5,.5,.4,.25,p);break;
  case 27:{foto('08-rosa-cromatica',1.6,.5,.25);const a=clamp(p*3);brillo(760,330,190,.85*a,'255,255,255');caja('?',760,355,90,'#fff',a,'rgba(0,0,0,0)');break;}
  case 28: P('02-gota-medusa',1.6,1.9,.45,.45,.38,.33,p);brillo(486,420,80+20*Math.sin(t*4),.6,'210,235,255');break;
  default:{foto('00-caratula',1.0,.5,.5);ctx.fillStyle='rgba(10,5,30,.35)';ctx.fillRect(0,H*.55,W,H*.45);fila(t,clamp(p*4),300);caja('¿Qué cielo inventarías vos?',540,1380,58,'#ffe9a8',clamp((p-.1)*4),'rgba(60,30,110,.85)');lluvia(t,.25);}
  }
}
window.renderFrame=function(t){ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const i=segDe(t),t0=SEG[i],t1=finSeg(i),p=clamp((t-t0)/(t1-t0));
  toma(i,p,t);
  particulas(t);
  
  if(i<TXT.length-1)subtitulo(TXT[i],clamp((t-t0)/.2)*clamp((t1-t)/.2+.2));
  ctx.font='700 30px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('ChatGPT · Claude · Gemini · Grok',W/2,H-40);
  if(t>DUR+FIN-.7){ctx.fillStyle=`rgba(0,0,0,${clamp((t-(DUR+FIN-.7))/.7)})`;ctx.fillRect(0,0,W,H);}
  return cv.toDataURL('image/jpeg',.9);};
let pend=NOMBRES.length;NOMBRES.forEach(n=>{const im=new Image();im.onload=()=>{IMG[n]=im;if(--pend===0)setTimeout(()=>{window.READY=true;},300);};im.src='img/'+n+'.png';});
</script></body></html>
