function manual(i){tour=false;$('#tour').classList.remove('on');select(i);}picker.onchange=()=>manual(Number(picker.value));$('#overview').onclick=()=>manual(-1);$('#prev').onclick=()=>manual((selected+9)%10);$('#next').onclick=()=>manual((selected+1)%10);$('#tour').onclick=()=>{tour=!tour;$('#tour').classList.toggle('on',tour);if(tour)select(selected<0?0:selected);};$('#spin').onclick=()=>{ctl.autoRotate=!ctl.autoRotate;$('#spin').classList.toggle('on',ctl.autoRotate)};$('#night').onclick=()=>{night=!night;$('#night').classList.toggle('on',night);scene.background.setHex(night?0x172e51:0xadd9f5);scene.fog.color.copy(scene.background);hemi.intensity=night?.8:2.4;sun.intensity=night?.24:3.2;fill.intensity=night?1.0:1.3};ctl.addEventListener('start',()=>{dest=null;tour=false;$('#tour').classList.remove('on')});
const clock=new T.Clock();let time=0;function tick(){requestAnimationFrame(tick);let dt=Math.min(.05,clock.getDelta());time+=dt;moving.forEach(({o,axis,speed})=>o.rotation[axis]+=dt*speed);falls.forEach(({o,h,p})=>o.position.y=-((time*.55+p)%1)*h);embers.forEach(({o,x,z,p,y})=>o.position.set(x+.24*Math.sin(time*3+p*9),y+((time*.32+p)%1)*2.7,z+.22*Math.cos(time*2+p*6)));portalFX.forEach(({q,disk})=>{q.rotation.z=.05*Math.sin(time);disk.material.opacity=.23+.1*Math.sin(time*2)});clouds.forEach(({g,x,p})=>g.position.x=x+Math.sin(time*.08+p*6.28)*2.2);if(dest){let a=1-Math.exp(-dt*4);cam.position.lerp(dest[0],a);ctl.target.lerp(dest[1],a);if(cam.position.distanceTo(dest[0])<.05)dest=null;}if(tour){tourTime+=dt;if(tourTime>5.8)select((selected+1)%10);}ctl.update();R.render(scene,cam)}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});$('#load').style.display='none';select(-1);tick();
</script></body></html>
