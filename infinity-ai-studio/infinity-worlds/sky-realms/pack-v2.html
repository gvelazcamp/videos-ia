for(let i=0;i<14;i++)box(V(-.6,.16,1.1+i*.34),[1.25,.18,.30],i%2?iron:mat.stone,storm);for(let s of [-1,1])for(let i=0;i<6;i++){box(V(s*(1.1+i*.77),.26,1.6),[.72,.16,.95],iron,storm);box(V(s*(1.1+i*.77),.40,2.12),[.36,.12,.13],mat.gold,storm);}portal(0,5.7,storm,mat.gem);motesAround(storm,0,2,-1.1,2.5,34,mat.gem);

const cloudMat=new T.MeshBasicMaterial({color:0xe5f7ff,transparent:true,opacity:.78,depthWrite:false});for(let i=0;i<24;i++){let g=group(V(range(-69,69),range(-15,-9),range(-65,50)));for(let j=0;j<4;j++)box(V(j*1.6,range(-.3,.3),range(-.35,.35)),[range(2.8,4.0),range(.7,1.4),range(2.0,3.5)],cloudMat,g);clouds.push({g,x:g.position.x,p:rand()});}
// Batch fixed geometry inside each independent island. Keep animated groups intact.
const protectedMeshes=new Set();for(let {o} of [...moving,...falls,...embers,...flags,...motes,...floaters])o.traverse(c=>protectedMeshes.add(c));for(let {q,disk} of portalFX){protectedMeshes.add(q);protectedMeshes.add(disk);}
for(let island of islands){island.g.updateMatrixWorld(true);let by=new Map();island.g.traverse(o=>{if(!o.isMesh||protectedMeshes.has(o))return;let key=o.geometry.uuid+'|'+o.material.uuid;if(!by.has(key))by.set(key,[]);by.get(key).push(o);});let inv=island.g.matrixWorld.clone().invert();for(let list of by.values()){if(list.length<3)continue;let b=new T.InstancedMesh(list[0].geometry,list[0].material,list.length);list.forEach((o,i)=>{b.setMatrixAt(i,inv.clone().multiply(o.matrixWorld));o.removeFromParent()});b.instanceMatrix.needsUpdate=true;b.computeBoundingSphere();island.g.add(b);}}
let selected=-1,dest=null,night=false,tour=false,tourTime=0;const picker=$('#pick');islands.forEach((o,i)=>{let opt=document.createElement('option');opt.value=i;opt.textContent=o.name;picker.append(opt)});
function select(i){selected=i;picker.value=String(i);if(i<0){$('#name').textContent='Archipiélago completo';$('#desc').textContent='13 islas originales: diez mejoradas y tres nuevas.';dest=[V(125,91,155),V(0,0,-15)];}else{let o=islands[i],r=o.r;$('#name').textContent=o.name;$('#desc').textContent=o.desc;dest=[o.pos.clone().add(V(r*1.9,r*1.50,r*2.55)),o.pos.clone().add(V(0,-.7,0))];}tourTime=0;}
function manual(i){tour=false;$('#tour').classList.remove('on');select(i);}picker.onchange=()=>manual(Number(picker.value));$('#overview').onclick=()=>manual(-1);$('#prev').onclick=()=>manual((selected+islands.length-1)%islands.length);$('#next').onclick=()=>manual((selected+1)%islands.length);$('#tour').onclick=()=>{tour=!tour;$('#tour').classList.toggle('on',tour);if(tour)select(selected<0?0:selected);};$('#spin').onclick=()=>{ctl.autoRotate=!ctl.autoRotate;$('#spin').classList.toggle('on',ctl.autoRotate)};$('#night').onclick=()=>{night=!night;$('#night').classList.toggle('on',night);scene.background.setHex(night?0x172e51:0xadd9f5);scene.fog.color.copy(scene.background);hemi.intensity=night?.8:2.4;sun.intensity=night?.24:3.2;fill.intensity=night?1.0:1.3};ctl.addEventListener('start',()=>{dest=null;tour=false;$('#tour').classList.remove('on')});
const clock=new T.Clock();let time=0;function tick(){requestAnimationFrame(tick);let dt=Math.min(.05,clock.getDelta());time+=dt;moving.forEach(({o,axis,speed})=>o.rotation[axis]+=dt*speed);falls.forEach(({o,h,p})=>o.position.y=-((time*.55+p)%1)*h);embers.forEach(({o,x,z,p,y})=>o.position.set(x+.24*Math.sin(time*3+p*9),y+((time*.32+p)%1)*2.7,z+.22*Math.cos(time*2+p*6)));portalFX.forEach(({q,disk})=>{q.rotation.z=.05*Math.sin(time);disk.material.opacity=.23+.1*Math.sin(time*2)});flags.forEach(({o,i,p})=>{o.position.z=.11*Math.sin(time*3-i*.5+p);o.rotation.y=.18*Math.sin(time*3-i*.5+p)});motes.forEach(({o,x,y,z,r,p,a})=>{let q=time*.7+a;o.position.set(x+Math.cos(q)*r*(.5+.5*p),y+Math.sin(time*1.6+p*12)*.7,z+Math.sin(q)*r*(.5+.5*p));o.rotation.y=time});floaters.forEach(({o,y,p,amp})=>o.position.y=y+Math.sin(time*1.4+p)*amp);clouds.forEach(({g,x,p})=>g.position.x=x+Math.sin(time*.08+p*6.28)*2.2);if(dest){let a=1-Math.exp(-dt*4);cam.position.lerp(dest[0],a);ctl.target.lerp(dest[1],a);if(cam.position.distanceTo(dest[0])<.05)dest=null;}if(tour){tourTime+=dt;if(tourTime>7.8)select((selected+1)%islands.length);}ctl.update();R.render(scene,cam)}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});$('#load').style.display='none';select(-1);tick();
</script></body></html>
