name: Voltito realista - preparar giro 360 desde diseño original
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voltito-realista-360-20261117.yml'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: voltito-realista-360-20261117
  cancel-in-progress: false

jobs:
  preparar-4-vistas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas de recorte
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Extraer las vistas de la misma imagen de Voltito
        run: python experimentos/voltito-realista-360-20261117/preparar_assets.py
      - name: Verificar transparencia y las cuatro vistas
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder=Path("experimentos/voltito-realista-360-20261117")
          for name in ("frente","izquierda","derecha","espalda"):
              p=folder/f"voltito-{name}.png"
              with Image.open(p) as img:
                  img.load()
                  assert img.format=="PNG" and img.mode=="RGBA" and img.size==(460,560)
                  assert img.getchannel("A").getextrema()==(0,255)
                  print("PNG verificado:",str(p),img.size)
          with Image.open(folder/"voltito-hoja-original.png") as im:
              assert im.size==(1536,1152)
          print("Diseño original y recortes conservados")
          PY
      - name: Guardar exclusivamente archivos nuevos del visor
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/voltito-realista-360-20261117/*.png
          if git diff --cached --quiet; then
            echo "Sin cambios en imágenes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Voltito realista: imágenes originales y cuatro recortes para giro 360"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Artefacto con las vistas transparentes
        uses: actions/upload-artifact@v4
        with:
          name: voltito-realista-360-png
          path: experimentos/voltito-realista-360-20261117/*.png
          retention-days: 7
          if-no-files-found: error
