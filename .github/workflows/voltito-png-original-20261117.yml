name: Voltito original - PNG transparente fiel a referencia
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voltito-png-original-20261117.yml'
      - 'experimentos/voltito-png-original-20261117/recortar.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voltito-png-original-20261117
  cancel-in-progress: false

jobs:
  recortar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Python, OpenCV, Remove.bg web (sin API ni pagos)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless playwright
          python -m playwright install --with-deps chromium
      - name: Recortar la imagen grande del mismo Voltito, sin redibujarla
        run: python experimentos/voltito-png-original-20261117/recortar.py preparar
      - name: Obtener transparencia con Remove.bg del puente existente
        if: ${{ hashFiles('experimentos/voltito-png-original-20261117/voltito-removebg-preview.png') == '' }}
        env:
          IMAGE_PATH: experimentos/voltito-png-original-20261117/voltito-referencia-limpia.png
          OUTPUT_PATH: experimentos/voltito-png-original-20261117/voltito-removebg-preview.png
        run: python herramientas/removebg-web/remover.py
      - name: Guardar muestra del recorte para revisar el resultado de Remove.bg
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/voltito-png-original-20261117/voltito-removebg-preview.png
          git add -- experimentos/voltito-png-original-20261117/voltito-referencia-limpia.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Voltito original: guardar referencia y máscara Remove.bg para inspección"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Recuperar los colores y detalle originales a resolución nativa
        run: python experimentos/voltito-png-original-20261117/recortar.py finalizar
      - name: Verificar PNG RGBA sin fondo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path("experimentos/voltito-png-original-20261117/voltito-original-transparente.png")
          with Image.open(p) as im:
              im.load()
              assert im.format=="PNG" and im.mode=="RGBA" and im.size==(1152,1728)
              assert im.getchannel("A").getextrema()==(0,255)
              print("PNG validado",p,im.size)
          PY
      - name: Guardar solo archivos de esta carpeta
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/voltito-png-original-20261117/*.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Voltito original: PNG transparente fiel al diseño aprobado"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Archivo PNG descargable
        uses: actions/upload-artifact@v4
        with:
          name: voltito-original-png-transparente
          path: experimentos/voltito-png-original-20261117/voltito-original-transparente.png
          if-no-files-found: error
          retention-days: 7
