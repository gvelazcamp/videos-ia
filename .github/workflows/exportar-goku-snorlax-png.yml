name: "Exportar PNG Goku y Snorlax (asset independiente)"
on:
  push:
    branches: [main]
    paths:
      - "entrada-imagenes/goku-snorlax-siesta.svg"
      - ".github/workflows/exportar-goku-snorlax-png.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: exportar-goku-snorlax-png
  cancel-in-progress: false
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convertir SVG a PNG transparente de 2400 x 1800
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image
          src = Path("entrada-imagenes/goku-snorlax-siesta.svg")
          dst = Path("entrada-imagenes/goku-snorlax-siesta.png")
          cairosvg.svg2png(url=str(src), write_to=str(dst), output_width=2400, output_height=1800)
          with Image.open(dst) as im:
              im.load()
              assert im.format == "PNG"
              rgba = im.convert("RGBA")
              a = rgba.getchannel("A")
              assert a.getextrema()[0] == 0 and a.getextrema()[1] == 255, "Se requiere transparencia real"
              print(f"PNG generado: {dst}, {im.size}, RGBA")
          PY
      - name: Guardar solo PNG generado
        run: |
          git add -- entrada-imagenes/goku-snorlax-siesta.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Exportar PNG transparente Goku y Snorlax para estampado"
          git pull --rebase origin main
          git push origin HEAD:main
