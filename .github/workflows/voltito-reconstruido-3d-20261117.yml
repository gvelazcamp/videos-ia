name: Voltito reconstruido 3D - render y prueba 360
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voltito-reconstruido-3d-20261117.yml'
      - 'experimentos/voltito-reconstruido-20261117/index.html'
      - 'experimentos/voltito-reconstruido-20261117/voltito.js'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: voltito-reconstruido-3d-20261117
  cancel-in-progress: false
jobs:
  render-y-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador gratuito
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
      - name: Validar escena 3D nueva y capturar cuatro vistas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from threading import Thread
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          root=Path.cwd()
          folder=root/'experimentos/voltito-reconstruido-20261117'
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*a): pass
          srv=ThreadingHTTPServer(('127.0.0.1',8822),lambda *a,**kw:Quiet(*a,directory=str(root),**kw))
          Thread(target=srv.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(headless=True,args=['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
                  page=browser.new_page(viewport={'width':420,'height':870},device_scale_factor=1,is_mobile=True,has_touch=True)
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.goto('http://127.0.0.1:8822/experimentos/voltito-reconstruido-20261117/index.html',wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_function('window.__VOLTITO_RECONSTRUCCION__ !== undefined',timeout=45000)
                  assert not errors, str(errors)
                  info=page.evaluate('window.__VOLTITO_RECONSTRUCCION__.geometryInfo()')
                  print('GEOMETRIA 3D:',info)
                  assert info['meshCount']>=45 and info['head'] and info['ears']==4 and info['fur']>=4
                  assert page.locator('#visor canvas').count()==1
                  assert page.locator('.views-grid img').count()==4
                  for img in page.locator('.views-grid img').all():
                      assert img.evaluate('(im)=>im.complete && im.naturalWidth>0'),'Imagen de referencia no disponible'
                  page.wait_for_timeout(700)
                  page.locator('#visor').screenshot(path=str(folder/'preview-frente.png'))
                  for value,name in [(90,'perfil-izquierda'),(180,'espalda'),(270,'perfil-derecha')]:
                      page.locator('#angle').evaluate('(x,v)=>{x.value=v;x.dispatchEvent(new Event("input",{bubbles:true}))}',value)
                      assert page.locator('#degree').inner_text()==f'{value}°'
                      page.wait_for_timeout(180)
                      page.locator('#visor').screenshot(path=str(folder/f'preview-{name}.png'))
                  page.locator('#reset').click()
                  assert page.locator('#degree').inner_text()=='0°'
                  browser.close()
              for filename in ('preview-frente.png','preview-perfil-izquierda.png','preview-espalda.png','preview-perfil-derecha.png'):
                  with Image.open(folder/filename) as pic:
                      pic.load()
                      assert pic.width>=350 and pic.height>=340
                      rgb=pic.convert('RGB').resize((96,120))
                      gold=sum(1 for r,g,b in rgb.getdata() if r>140 and g>80 and b<170 and r>g*1.07)
                      print(filename,'pixeles amarillos:',gold)
                      assert gold>200,'Voltito no visible en imagen'
          finally:
              srv.shutdown()
          print('RENDER MOVIL, PERFIL, ESPALDA Y ROTACION: OK')
          PY
      - name: Guardar únicamente capturas verificadas en carpeta nueva
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/voltito-reconstruido-20261117/preview-*.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Voltito nuevo 3D: 4 vistas verificadas en móvil'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Adjuntar capturas
        uses: actions/upload-artifact@v4
        with:
          name: voltito-reconstruccion-3d-cuatro-vistas
          path: experimentos/voltito-reconstruido-20261117/preview-*.png
          if-no-files-found: error
          retention-days: 7
