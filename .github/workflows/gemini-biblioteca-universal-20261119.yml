name: Gemini 3D - 12 movimientos en visor universal

on:
  push:
    paths:
      - 'experimentos/gemini-movimientos-universal-20261119/generar_biblioteca.py'
      - '.github/workflows/gemini-biblioteca-universal-20261119.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-biblioteca-universal-20261119
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Blender y numpy
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout 150 sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=15
          timeout 300 sudo apt-get install -y --no-install-recommends blender python3-numpy
      - name: Crear Gemini con 12 animaciones y saludo hacia delante
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 2 --python-exit-code 1 \
            --python experimentos/gemini-movimientos-universal-20261119/generar_biblioteca.py \
            -- experimentos/gemini-azul-articulado-corriendo-20261119/resultado/Gemini_3D_Corriendo_Articulado.glb \
               experimentos/gemini-movimientos-universal-20261119/resultado
      - name: Verificar GLB con 12 clips, esqueleto y dos vistas de saludo
        shell: bash
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          root=Path('experimentos/gemini-movimientos-universal-20261119/resultado')
          file=root/'Gemini_Biblioteca_12_Movimientos.glb'
          raw=file.read_bytes()
          assert raw[:4]==b'glTF'
          assert struct.unpack_from('<I',raw,8)[0]==len(raw)
          j=json.loads(raw[20:20+struct.unpack_from('<I',raw,12)[0]])
          assert len(j['skins'][0]['joints'])>=15
          names=[x.get('name','') for x in j['animations']]
          required=['Reposo','Caminar_lento','Correr','Saludar','Girar_izquierda','Girar_derecha','Frenar','Saltar','Agarrar_objeto','Soltar_objeto','Sentarse','Levantarse']
          assert len(names)>=12
          assert all(any(r in name for name in names) for r in required),names
          for img in ('saludo_frontal.png','saludo_45_grados.png'):
            data=(root/img).read_bytes()
            assert data.startswith(b'\x89PNG\r\n\x1a\n') and len(data)>5000
          print('GEMINI_UNIVERSAL_12_CLIPS_OK',len(j['skins'][0]['joints']),names)
          PY
      - name: Publicar solo la biblioteca nueva de Gemini
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/gemini-movimientos-universal-20261119/resultado/
          if git diff --cached --quiet; then echo 'Sin cambios'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Gemini: 12 animaciones y saludo frontal validado para visor universal'
          git pull --rebase origin main
          git push origin HEAD:main
