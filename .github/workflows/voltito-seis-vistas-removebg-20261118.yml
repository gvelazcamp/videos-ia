name: Voltito seis vistas fieles - Remove.bg y visor 360
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voltito-seis-vistas-removebg-20261118.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voltito-seis-vistas-removebg-20261118
  cancel-in-progress: false

jobs:
  preparar-validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Herramientas gratuitas
        run: |
          python -m pip install --disable-pip-version-check pillow numpy playwright
          python -m playwright install --with-deps chromium
      - name: Recortar las dos vistas de la nueva fotografía del usuario
        run: python experimentos/voltito-360-fiel-nuevas-vistas-20261118/procesar.py preparar
      - name: Remove.bg web gratuito sin API ni créditos
        shell: bash
        run: |
          set -euo pipefail
          for vista in frente derecha; do
            IMAGE_PATH="experimentos/voltito-360-fiel-nuevas-vistas-20261118/fuente-${vista}.png" \
            OUTPUT_PATH="experimentos/voltito-360-fiel-nuevas-vistas-20261118/removebg-${vista}.png" \
            python herramientas/removebg-web/remover.py
          done
      - name: Conservar píxeles originales y crear PNG transparentes
        run: python experimentos/voltito-360-fiel-nuevas-vistas-20261118/procesar.py finalizar
      - name: Probar PNG y visor en Android móvil simulado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from threading import Thread
          from playwright.sync_api import sync_playwright
          root=Path.cwd()
          base=root/"experimentos/voltito-360-fiel-nuevas-vistas-20261118"
          names=["frente","trescuartos-reflejo","derecha","espalda","izquierda","trescuartos-original"]
          for name in names:
              f=base/f"voltito-{name}.png"
              with Image.open(f) as img:
                  img.load()
                  assert img.format=="PNG" and img.mode=="RGBA" and img.size==(1200,1550)
                  assert img.getchannel("A").getextrema()==(0,255)
                  assert img.getpixel((0,0))[3]==0
                  print("OK:",name,f.stat().st_size)
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*a):pass
          server=ThreadingHTTPServer(("127.0.0.1",8879),lambda *a,**kw:Quiet(*a,directory=str(root),**kw))
          Thread(target=server.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(headless=True,args=["--no-sandbox"])
                  page=browser.new_page(viewport={"width":393,"height":851},device_scale_factor=1,is_mobile=True,has_touch=True)
                  errors=[]
                  page.on("pageerror",lambda e:errors.append(str(e)))
                  page.goto("http://127.0.0.1:8879/experimentos/voltito-360-fiel-nuevas-vistas-20261118/index.html",wait_until="domcontentloaded",timeout=60000)
                  page.wait_for_function("window.__VOLTITO_POSES__?.getState()?.ready===true",timeout=35000)
                  assert not errors,errors
                  assert page.locator(".frame").count()==6
                  for degree,name in [(0,"frente"),(45,"trescuartos-reflejo"),(90,"derecha"),(180,"espalda"),(270,"izquierda"),(315,"trescuartos-original")]:
                      page.evaluate("(v)=>window.__VOLTITO_POSES__.update(v)",degree)
                      assert page.locator("#degrees").inner_text()==f"{degree}°"
                      assert page.evaluate("window.__VOLTITO_POSES__.getState().pose")==name,(degree,name)
                      page.wait_for_function("document.querySelector('#photo').complete && document.querySelector('#photo').naturalWidth>0")
                      page.locator("#stage").screenshot(path=str(base/f"captura-{name}.png"))
                      print("VISOR móvil OK",degree,name)
                  page.locator("#back").click()
                  assert page.locator("#status").inner_text().startswith("Costado izquierdo")
                  page.locator("#reset").click()
                  assert page.locator("#degrees").inner_text()=="0°"
                  page.locator("#spin").click()
                  assert "Pausar" in page.locator("#spin").inner_text()
                  page.locator("#bg").click()
                  assert page.locator("#stage").evaluate("(x)=>x.classList.contains('checker')")
                  assert not errors,errors
                  browser.close()
              print("ÉXITO: 6 vistas reales, transparencia y controles táctiles verificados")
          finally:
              server.shutdown()
          PY
      - name: Publicar solamente los nuevos recursos
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/voltito-360-fiel-nuevas-vistas-20261118/*.png
          git add -- experimentos/voltito-360-fiel-nuevas-vistas-20261118/*.jpg
          if git diff --cached --quiet; then
            echo "Los recursos ya estaban publicados"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Voltito original: seis poses PNG reales con Remove.bg'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Entregar las seis poses verificadas
        uses: actions/upload-artifact@v4
        with:
          name: voltito-6-poses-fieles-removebg
          path: |
            experimentos/voltito-360-fiel-nuevas-vistas-20261118/voltito-*.png
            experimentos/voltito-360-fiel-nuevas-vistas-20261118/comparacion-vistas.jpg
          retention-days: 7
          if-no-files-found: error
