name: Voltito referencias HD de usuario y Remove.bg
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voltito-referencias-hd-20261117.yml'
      - 'experimentos/voltito-reconstruido-20261117/referencias.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voltito-referencias-hd
  cancel-in-progress: false
jobs:
  hd:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Instalar procesador gratuito
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless playwright
          python -m playwright install --with-deps chromium
      - name: Descargar exactamente los PNG adjuntados, sin redibujar
        run: python experimentos/voltito-reconstruido-20261117/referencias.py preparar
      - name: Comprobar silueta con Remove.bg web gratuito
        shell: bash
        run: |
          set -euo pipefail
          for vista in perfil espalda; do
            IMAGE_PATH="experimentos/voltito-reconstruido-20261117/referencias/para-removebg-${vista}.png" \
            OUTPUT_PATH="experimentos/voltito-reconstruido-20261117/referencias/preview-removebg-${vista}.png" \
            python herramientas/removebg-web/remover.py
          done
      - name: Combinar el recorte con los píxeles HD originales
        run: python experimentos/voltito-reconstruido-20261117/referencias.py finalizar
      - name: Guardar solo referencias finales sin tocar trabajos anteriores
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/voltito-reconstruido-20261117/referencias/original-*.png
          git add -- experimentos/voltito-reconstruido-20261117/referencias/voltito-*-removebg-hd.png
          git add -- experimentos/voltito-reconstruido-20261117/referencias/pelaje-oro.jpg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Voltito: guardar referencias HD reales con Remove.bg'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: voltito-referencias-hd-removebg
          path: experimentos/voltito-reconstruido-20261117/referencias/voltito-*-removebg-hd.png
          if-no-files-found: error
          retention-days: 7
