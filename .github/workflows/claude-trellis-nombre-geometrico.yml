name: Claude TRELLIS - placa 3D con letras geométricas

on:
  push:
    paths:
      - 'experimentos/claude-trellis-20261119/nombre-geometrico.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-placa-geometrica
  cancel-in-progress: false

jobs:
  corregir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar librerías de malla y texto vectorial
        run: python -m pip install --disable-pip-version-check 'trimesh>=4,<5' 'numpy>=1.26,<3' 'shapely>=2.1,<3' 'matplotlib>=3.9,<4' rtree
      - name: Construir letras Claude como geometría real, sin texturas invertidas
        run: python experimentos/claude-trellis-20261119/nombre-geometrico.py
      - name: Publicar solamente el nuevo GLB y validación
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/claude-trellis-20261119/claude-trellis-nombre-legible.glb
          git add -- experimentos/claude-trellis-20261119/resultado-nombre-legible.json
          if git diff --cached --quiet; then
            echo 'No se generó la corrección'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Claude TRELLIS: placa blanca y letras 3D Claude orientadas correctamente"
          git pull --rebase origin main
          git push origin HEAD:main
