name: Voltito - publicar PNG transparente final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voltito-publicar-png-20261117.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voltito-publicar-png-20261117
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de imagen
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Recuperar el Voltito ORIGINAL con alfa de Remove.bg ya guardado
        run: python experimentos/voltito-png-original-20261117/recortar.py finalizar
      - name: Verificar que es PNG con transparencia real
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base=Path('experimentos/voltito-png-original-20261117')
          for name in ('voltito-original-nativo.png','voltito-original-transparente.png'):
              p=base/name
              with Image.open(p) as im:
                  im.load()
                  assert im.format=='PNG' and im.mode=='RGBA',f'PNG RGBA inválido: {p}'
                  assert im.getchannel('A').getextrema()==(0,255),f'Fondo no transparente: {p}'
                  assert im.getchannel('A').getbbox(),f'Máscara vacía: {p}'
                  print('Validado:',p,im.size)
          PY
      - name: Publicar exclusivamente las dos imágenes nuevas de Voltito
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/voltito-png-original-20261117/voltito-original-nativo.png
          git add -- experimentos/voltito-png-original-20261117/voltito-original-transparente.png
          if git diff --cached --quiet; then
            echo "Las imágenes ya estaban publicadas."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Voltito: publicar PNG transparente del diseño original'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Adjuntar PNG final descargable
        uses: actions/upload-artifact@v4
        with:
          name: voltito-original-png-final
          path: experimentos/voltito-png-original-20261117/voltito-original-transparente.png
          if-no-files-found: error
          retention-days: 7
