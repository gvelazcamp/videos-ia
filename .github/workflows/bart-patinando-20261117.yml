name: Bart patinando - imagen real y Remove.bg
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bart-patinando-20261117.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bart-patinando-20261117
  cancel-in-progress: false
jobs:
  preparar-bart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_PATH: experimentos/bart-patinando-20261117/bart-referencia.png
      OUTPUT_PATH: experimentos/bart-patinando-20261117/bart-patinando-transparente.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar imagen de Bart patinando desde referencia pública
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, UnidentifiedImageError
          from urllib.request import Request, urlopen
          import io
          urls = [
              "https://image.pngaaa.com/820/1308820-middle.png",
              "https://www.pinclipart.com/picdir/middle/120-1207831_drawing-skateboard-bart-simpson-bart-simpson-en-skate.png",
              "https://www.pngitem.com/pimgs/m/159-1596868_bart-simpson-with-skattor-bart-simpson-skateboard-tattoo.png",
          ]
          dest = Path("experimentos/bart-patinando-20261117/bart-referencia.png")
          dest.parent.mkdir(parents=True, exist_ok=True)
          for url in urls:
              try:
                  req = Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; reference image download)"})
                  with urlopen(req, timeout=25) as resp:
                      data = resp.read(15000000)
                  with Image.open(io.BytesIO(data)) as img:
                      img.load()
                      if img.width < 160 or img.height < 160:
                          raise ValueError("Imagen demasiado pequeña")
                      img.convert("RGBA").save(dest)
                      print(f"REFERENCIA: {url}, {img.size}")
                      break
              except Exception as err:
                  print(f"Falló fuente {url}: {type(err).__name__}: {err}")
          else:
              raise RuntimeError("No se pudo descargar ninguna imagen; no se modificarán los archivos existentes.")
          PY
      - name: Instalar navegador gratuito para Remove.bg
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
      - name: Quitar fondo con Remove.bg web sin API ni créditos
        run: python herramientas/removebg-web/remover.py
      - name: Verificar y guardar solo las imágenes de Bart
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          with Image.open("experimentos/bart-patinando-20261117/bart-patinando-transparente.png") as img:
              img.load()
              if img.mode != "RGBA" or img.getchannel("A").getextrema()[0] == 255:
                  raise ValueError("El PNG no tiene transparencia real")
              print("Resultado PNG RGBA con canal alfa verificado", img.size)
          PY
          git add -- experimentos/bart-patinando-20261117/bart-referencia.png experimentos/bart-patinando-20261117/bart-patinando-transparente.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bart patinando: referencia real y PNG Remove.bg'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Copia PNG
        uses: actions/upload-artifact@v4
        with:
          name: bart-patinando-png-transparente
          path: experimentos/bart-patinando-20261117/bart-patinando-transparente.png
          retention-days: 7
