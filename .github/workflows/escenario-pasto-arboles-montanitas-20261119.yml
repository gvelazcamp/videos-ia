name: Generar escenario 02 - arboles y montanitas con Blender

on:
  push:
    paths:
      - '.github/workflows/escenario-pasto-arboles-montanitas-20261119.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escenario-arboles-montanitas-20261119
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v4
      - name: Instalar Blender en GitHub Actions (no local)
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout 150 sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=15
          timeout 300 sudo apt-get install -y --no-install-recommends blender python3-numpy xvfb
          blender --version | head -n 2
      - name: Generar colinas suaves y arboles reales con Blender
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" blender -b -t 2 --python-exit-code 1 \
            --python experimentos/escenario-pasto-arboles-montanitas-20261119/generar.py
      - name: Validar 10 arboles, 3 lomas, GLB, .blend y PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          root=Path('experimentos/escenario-pasto-arboles-montanitas-20261119/resultado')
          glb=(root/'escenario_pasto_arboles_montanitas.glb').read_bytes()
          assert glb[:4]==b'glTF' and struct.unpack_from('<I',glb,8)[0]==len(glb)
          n=struct.unpack_from('<I',glb,12)[0]
          meta=json.loads(glb[20:20+n])
          assert len(meta.get('meshes',[]))>=25
          assert (root/'vista_previa.png').read_bytes()[:8]==bytes((137,80,78,71,13,10,26,10))
          assert (root/'escenario_pasto_arboles_montanitas.blend').stat().st_size>1000
          report=json.loads((root/'informe.json').read_text())
          assert report['arboles']==10 and report['montanitas']==3
          assert report['altura_maxima_terreno_m']>2.5
          print('ESCENARIO_02_OK',report)
          PY
      - name: Publicar exclusivamente los archivos del nuevo escenario
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/escenario-pasto-arboles-montanitas-20261119/resultado/escenario_pasto_arboles_montanitas.glb \
                     experimentos/escenario-pasto-arboles-montanitas-20261119/resultado/escenario_pasto_arboles_montanitas.blend \
                     experimentos/escenario-pasto-arboles-montanitas-20261119/resultado/vista_previa.png \
                     experimentos/escenario-pasto-arboles-montanitas-20261119/resultado/informe.json
          if git diff --cached --quiet; then
            echo 'Los archivos de esta version ya estaban publicados'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generar escenario 02 con arboles y montanitas'
          git pull --rebase origin main
          git push origin HEAD:main
