name: Inspeccionar skeleton Goku Vegeta y deformaciones

on:
  push:
    paths:
      - '.github/workflows/diagnostico-rig-goku-vegeta.yml'
      - 'serpiente-cardio-tv/prueba-carrera-3d-20261122/diagnostico_rig.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspeccion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Diagnosticar esqueleto original y frames
        run: |
          blender -b -t 2 --python-exit-code 1 --python serpiente-cardio-tv/prueba-carrera-3d-20261122/diagnostico_rig.py
      - name: Publicar sólo reporte de diagnóstico
        run: |
          set -euo pipefail
          git add -- serpiente-cardio-tv/prueba-carrera-3d-20261122/diagnostico-rig.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Informe rig original Goku Vegeta: joints y deformacion por frame"
          git pull --rebase origin main
          git push origin HEAD:main
