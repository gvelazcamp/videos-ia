name: Pikachu castillo - generar recorte transparente
on:
  push:
    branches: [main]
    paths:
      - 'experimentos/pikachu-castillo-terror/limpiar_personaje.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pikachu-castillo-recorte
  cancel-in-progress: false
jobs:
  png-transparente:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar dependencias gratuitas
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Recortar la referencia original sin redibujar el personaje
        run: python experimentos/pikachu-castillo-terror/limpiar_personaje.py
      - name: Verificar PNG y canal transparente
        run: |
          python - <<'PY'
          from PIL import Image
          p = 'experimentos/pikachu-castillo-terror/personaje-original-transparente.png'
          im = Image.open(p)
          assert im.mode == 'RGBA' and im.size == (298, 342)
          assert im.getpixel((0,0))[3] == 0
          assert im.getpixel((150,200))[3] > 250
          print('PNG RGBA verificado, fondo transparente, personaje conservado')
          PY
      - name: Guardar exclusivamente el PNG del experimento
        run: |
          set -euo pipefail
          git add -- experimentos/pikachu-castillo-terror/personaje-original-transparente.png
          if git diff --cached --quiet; then
            echo 'PNG sin cambios'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Recorte transparente PNG del personaje para castillo'
          git pull --rebase origin main
          git push origin HEAD:main
