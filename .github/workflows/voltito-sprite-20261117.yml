name: Voltito - sprite transparente individual 20261117
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voltito-sprite-20261117.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voltito-sprite-20261117
  cancel-in-progress: false

jobs:
  crear-png:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas gratuitas
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Generar sprite transparente del Voltito original
        run: python experimentos/voltito-sprite-20261117/crear_png.py
      - name: Publicar únicamente el PNG nuevo
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/voltito-sprite-20261117/voltito-sonriente-transparente.png
          if git diff --cached --quiet; then
            echo "El PNG ya coincide con el publicado"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Voltito: PNG individual de fondo transparente'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Adjuntar PNG verificable
        uses: actions/upload-artifact@v4
        with:
          name: voltito-sonriente-transparente
          path: experimentos/voltito-sprite-20261117/voltito-sonriente-transparente.png
          if-no-files-found: error
          retention-days: 7
