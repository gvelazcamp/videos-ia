name: Voltito - probar Hunyuan 3D multivista gratis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voltito-multivista-gratis-prueba-20261118.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check "gradio_client>=1.6,<3"
      - name: Verificar API publica y requisitos de GPU remota, sin gastar créditos
        run: python experimentos/voltito-3d-multivista-prueba-20261118/probar_hunyuan.py
