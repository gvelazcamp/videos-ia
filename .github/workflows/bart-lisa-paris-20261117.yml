name: Bart y Lisa patinando en París - montar escena
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bart-lisa-paris-20261117.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bart-lisa-paris-20261117
  cancel-in-progress: false

jobs:
  escena:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_PATH: experimentos/bart-lisa-paris-20261117/lisa-referencia.png
      OUTPUT_PATH: experimentos/bart-lisa-paris-20261117/lisa-transparente.png

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas del puente
        run: |
          python -m pip install --disable-pip-version-check pillow playwright
          python -m playwright install --with-deps chromium
      - name: Descargar Lisa y escenario de París
        run: python experimentos/bart-lisa-paris-20261117/escena.py preparar
      - name: Recortar Lisa con Remove.bg existente - gratis sin API
        run: python herramientas/removebg-web/remover.py
      - name: Componer a Bart y Lisa patinando en París
        run: python experimentos/bart-lisa-paris-20261117/escena.py montar
      - name: Verificar imagen final
        run: |
          python - <<'PY'
          from PIL import Image
          p='experimentos/bart-lisa-paris-20261117/bart-y-lisa-patinando-en-paris.png'
          with Image.open(p) as im:
              im.load()
              assert im.format == "PNG" and im.size == (1600, 900) and im.mode == "RGB"
              print("Montaje verificado:", p, im.size)
          PY
      - name: Guardar únicamente los nuevos recursos en Git
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/bart-lisa-paris-20261117/*.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Montaje Bart y Lisa patinando en París'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Guardar PNG final como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: bart-lisa-paris-1600x900
          path: experimentos/bart-lisa-paris-20261117/bart-y-lisa-patinando-en-paris.png
          retention-days: 7
