name: Voltito 3D multivista - probar GLB con visor móvil
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voltito-multivista-visor-prueba-20261118.yml'
      - 'experimentos/voltito-3d-multivista-prueba-20261118/index.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voltito-multivista-visor-prueba-20261118
  cancel-in-progress: false
jobs:
  visor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Instalar navegador gratuito de revisión
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
      - name: Incorporar loader Three.js oficial para leer GLB, no crear geometría
        shell: bash
        run: |
          set -euo pipefail
          dir='experimentos/voltito-3d-multivista-prueba-20261118'
          curl --fail --retry 3 -sSL 'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/jsm/loaders/GLTFLoader.js' -o "$dir/GLTFLoader.js"
          curl --fail --retry 3 -sSL 'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/jsm/utils/BufferGeometryUtils.js' -o "$dir/BufferGeometryUtils.js"
          python - <<'PY'
          from pathlib import Path
          d=Path("experimentos/voltito-3d-multivista-prueba-20261118")
          p=d/"GLTFLoader.js"
          s=p.read_text().replace("from 'three'","from '../voltito-3d-alta-calidad-20261117/three.module.js'").replace("from '../utils/BufferGeometryUtils.js'","from './BufferGeometryUtils.js'")
          p.write_text(s)
          p=d/"BufferGeometryUtils.js"
          t=p.read_text().replace("from 'three'","from '../voltito-3d-alta-calidad-20261117/three.module.js'")
          p.write_text(t)
          assert (d/"candidato-voltito-sin-texturas.glb").stat().st_size>1000000
          PY
      - name: Capturar 4 ángulos reales en Chrome móvil para revisión humana
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from threading import Thread
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          from PIL import Image
          root=Path.cwd()
          folder=root/"experimentos/voltito-3d-multivista-prueba-20261118"
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*a):pass
          srv=ThreadingHTTPServer(("127.0.0.1",8834),lambda *a,**kw:Quiet(*a,directory=str(root),**kw))
          Thread(target=srv.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as pw:
                  b=pw.chromium.launch(headless=True,args=["--no-sandbox","--enable-webgl","--use-gl=angle","--use-angle=swiftshader","--enable-unsafe-swiftshader"])
                  page=b.new_page(viewport={"width":410,"height":860},device_scale_factor=1,is_mobile=True,has_touch=True)
                  errors=[]
                  page.on("pageerror",lambda e:errors.append(str(e)))
                  page.goto("http://127.0.0.1:8834/experimentos/voltito-3d-multivista-prueba-20261118/index.html",wait_until="domcontentloaded",timeout=90000)
                  page.wait_for_function("window.__VOLTITO_3D__?.ready===true",timeout=85000)
                  print("Escena 3D y geometría:",page.evaluate("window.__VOLTITO_3D__.geometryBounds"))
                  assert not errors,errors
                  for angle,name in [(0,"frente"),(37,"intermedio-37"),(90,"perfil"),(128,"intermedio-128"),(180,"espalda"),(270,"otro-perfil")]:
                      page.locator("#angle").evaluate("(el,value)=>{el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));}",angle)
                      assert page.locator("#degree").inner_text()==str(angle)+"°"
                      page.wait_for_timeout(700)
                      file=folder/f"revision-real-3d-{name}.png"
                      page.locator("#canvas").screenshot(path=str(file))
                      with Image.open(file) as im:
                          pix=list(im.convert("RGB").resize((90,120)).getdata())
                          n=sum(1 for r,g,b in pix if r>125 and g>75 and b<150 and r>g*1.12)
                          print("Diagnóstico de luminosidad de malla",name,n,flush=True)
                      print("Captura de malla genuina",name,file.stat().st_size,flush=True)
                  b.close()
          finally:
              srv.shutdown()
          PY
      - name: Publicar sólo visor experimental y capturas, sin tocar originales
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/voltito-3d-multivista-prueba-20261118/GLTFLoader.js
          git add -- experimentos/voltito-3d-multivista-prueba-20261118/BufferGeometryUtils.js
          git add -- experimentos/voltito-3d-multivista-prueba-20261118/revision-real-3d-*.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Voltito multivista real: capturas de GLB para validar apariencia'
          git pull --rebase origin main
          git push origin HEAD:main
