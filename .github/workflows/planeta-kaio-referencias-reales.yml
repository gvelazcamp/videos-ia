name: Preparar planeta de Kaio y personaje real transparentes

on:
  push:
    paths:
      - '.github/workflows/planeta-kaio-referencias-reales.yml'
      - 'serpiente-cardio-tv/preparar_planeta_kaio.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planeta-kaio-assets-20261122
  cancel-in-progress: false

jobs:
  preparar-recortes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar dependencias gratuitas de recorte
        run: python -m pip install pillow requests
      - name: Descargar y recortar las referencias
        run: python serpiente-cardio-tv/preparar_planeta_kaio.py
      - name: Verificar transparencia e imágenes reales
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          r=Path("serpiente-cardio-tv/assets-kaio")
          for n in ("planeta-real.webp","kaio-real.webp"):
              p=r/n
              assert p.exists() and p.stat().st_size>4000,n
              im=Image.open(p).convert("RGBA")
              assert im.getchannel("A").getextrema()[0]==0, n+" no tiene transparencia"
              assert im.width>200 and im.height>200,n
              print(n,im.size,p.stat().st_size)
          PY
      - name: Publicar solamente imágenes nuevas para modo Kaio
        run: |
          set -euo pipefail
          git add -- serpiente-cardio-tv/assets-kaio/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Agregar imagenes reales y recortadas de planeta de Kaio y Kaio-sama'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planeta-kaio-referencias
          path: serpiente-cardio-tv/assets-kaio/
          retention-days: 5
          if-no-files-found: warn
