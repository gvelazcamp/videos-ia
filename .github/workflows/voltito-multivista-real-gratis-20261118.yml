name: Voltito 3D real multivista - prueba gratuita
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voltito-multivista-real-gratis-20261118.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voltito-multivista-real-gratis-20261118
  cancel-in-progress: false
jobs:
  reconstruir:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar cliente ligero de servicio gratuito sin GPU local
        run: |
          python -m pip install --disable-pip-version-check "gradio_client>=1.6,<3" pillow
      - name: Reconstruir malla 3D desde 4 vistas reales sin pagos
        run: python experimentos/voltito-3d-multivista-prueba-20261118/generar_modelo.py
      - name: Publicar sólo candidato que tenga formato GLB real
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/voltito-3d-multivista-prueba-20261118/candidato-voltito-*.glb
          git add -- experimentos/voltito-3d-multivista-prueba-20261118/estado.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Voltito: candidato real 3D multivista, pendiente de verificación visual'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Respaldar GLB candidato
        uses: actions/upload-artifact@v4
        with:
          name: voltito-candidato-glb-multivista
          path: experimentos/voltito-3d-multivista-prueba-20261118/candidato-voltito-*.glb
          retention-days: 7
          if-no-files-found: error
