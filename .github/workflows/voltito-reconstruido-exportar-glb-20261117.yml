name: Voltito - archivo 3D GLB real
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voltito-reconstruido-exportar-glb-20261117.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voltito-glb-real
  cancel-in-progress: false
jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Instalar Chrome para exportar malla
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Exportador Three.js oficial local
        run: |
          set -euo pipefail
          dest="experimentos/voltito-reconstruido-20261117"
          curl -LfsS --retry 3 'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/jsm/exporters/GLTFExporter.js' -o "$dest/GLTFExporter.js"
          curl -LfsS --retry 3 'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/jsm/utils/TextureUtils.js' -o "$dest/TextureUtils.js"
          python - <<'PY'
          from pathlib import Path
          d=Path("experimentos/voltito-reconstruido-20261117")
          p=d/"GLTFExporter.js"
          s=p.read_text().replace("from 'three'","from '../voltito-3d-alta-calidad-20261117/three.module.js'")
          s=s.replace("from './../utils/TextureUtils.js'","from './TextureUtils.js'")
          p.write_text(s)
          p=d/"TextureUtils.js"
          p.write_text(p.read_text().replace("from 'three'","from '../voltito-3d-alta-calidad-20261117/three.module.js'"))
          PY
      - name: Exportar y verificar GLB real del personaje
        run: python experimentos/voltito-reconstruido-20261117/exportar_glb.py
      - name: Guardar sólo GLB y exportador sin alterar otras versiones
        run: |
          set -euo pipefail
          git add -- experimentos/voltito-reconstruido-20261117/GLTFExporter.js
          git add -- experimentos/voltito-reconstruido-20261117/TextureUtils.js
          git add -- experimentos/voltito-reconstruido-20261117/voltito-reconstruido.glb
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Voltito nuevo: publicar malla tridimensional GLB'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: voltito-3d-glb-real
          path: experimentos/voltito-reconstruido-20261117/voltito-reconstruido.glb
          if-no-files-found: error
          retention-days: 7
