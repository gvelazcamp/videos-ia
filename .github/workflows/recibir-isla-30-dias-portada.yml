name: Recibir carátula isla 30 días (envío único)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recibir-isla-30-dias-portada.yml"
permissions:
  contents: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar y guardar carátula enviada por ChatGPT
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 2 --max-time 45 'https://d2ol7oe51mr4n9.cloudfront.net/user_3I6MEpvFp5hLW0psUqgXdDfyZXe/89e7b5d4-a5c1-437b-9120-5303a420ca75.jpg' -o /tmp/isla-portada.jpg
          echo 'b753fae1aefef5f88f44c558828d8d1a5fccbb6ea3f2920d3cbe9d8bc605ac2b  /tmp/isla-portada.jpg' | sha256sum -c -
          test "$(file -b --mime-type /tmp/isla-portada.jpg)" = "image/jpeg"
          mkdir -p referencias/recibidas
          cp /tmp/isla-portada.jpg referencias/recibidas/isla-30-dias-portada.jpg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add referencias/recibidas/isla-30-dias-portada.jpg
          if git diff --cached --quiet; then echo 'Portada ya estaba en el repositorio'; exit 0; fi
          git commit -m 'Carátula recibida: isla 30 días'
          git pull --rebase origin main
          git push origin HEAD:main
