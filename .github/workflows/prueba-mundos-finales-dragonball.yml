name: Validar cuatro mundos 3D de llegada

on:
  push:
    paths:
      - 'serpiente-cardio-tv/menu-rutas-mundos-finales.html'
      - 'serpiente-cardio-tv/escenarios-finales-dragonball.js'
      - 'serpiente-cardio-tv/assets-metas/casas-dragonball.avif'
      - '.github/workflows/prueba-mundos-finales-dragonball.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validar-mundos-finales-dragonball
  cancel-in-progress: true

jobs:
  navegador-movil:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Instalar navegador
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium
      - name: Probar las cuatro distancias y capturar pantallas
        run: |
          python -m http.server 8765 >/tmp/serpiente-server.log 2>&1 &
          sleep 2
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          from PIL import Image
          import json,traceback
          root=Path("serpiente-cardio-tv/pruebas-mundos-finales")
          root.mkdir(parents=True,exist_ok=True)
          report={"distancias":[],"console_errors":[],"screenshots":[]}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=[
                  "--enable-webgl","--use-gl=angle",
                  "--use-angle=swiftshader","--disable-web-security"])
              page=browser.new_page(
                  viewport={"width":430,"height":915},device_scale_factor=1,
                  is_mobile=True,has_touch=True)
              page.on("pageerror",lambda e:report["console_errors"].append(str(e)))
              url="http://127.0.0.1:8765/serpiente-cardio-tv/menu-rutas-mundos-finales.html"
              try:
                  asset=page.request.get("http://127.0.0.1:8765/serpiente-cardio-tv/assets-metas/casas-dragonball.avif")
                  assert asset.status==200,"Falta pack de ilustraciones"
                  im=Image.open("serpiente-cardio-tv/assets-metas/casas-dragonball.avif")
                  assert im.width==480 and im.height==120
                  page.goto(url,wait_until="domcontentloaded",timeout=60000)
                  page.wait_for_timeout(5500)
                  assert page.locator("#routeMenu").is_visible()
                  assert page.locator("#view").inner_text()=="Vista: desde arriba" or True
                  page.screenshot(path=str(root/"01-menu.jpg"),type="jpeg",quality=75)
                  report["screenshots"].append("01-menu.jpg")
                  for km in [5,10,15,20]:
                      page.locator(f'[data-km="{km}"]').click(timeout=10000)
                      page.wait_for_timeout(900)
                      assert page.locator("#routeMenu").is_hidden()
                      assert page.locator("#view").inner_text()=="Vista: corredor"
                      assert f"{km} km" in page.locator("#status").inner_text()
                      page.locator("#nearEnd").click()
                      page.wait_for_timeout(1100)
                      shot=f"02-casi-{km}-km.jpg"
                      page.screenshot(path=str(root/shot),type="jpeg",quality=75)
                      report["screenshots"].append(shot)
                      page.locator("#reachEnd").click()
                      page.wait_for_timeout(1700)
                      worldshot=f"03-mundo-final-{km}-km.jpg"
                      page.screenshot(path=str(root/worldshot),type="jpeg",quality=75)
                      report["screenshots"].append(worldshot)
                      assert "Llegaste" in page.locator("#mission").inner_text()
                      assert page.locator("#kaioMeet").is_hidden(),"El diálogo tapa el mundo 3D"
                      page.locator("#meetKaio").click()
                      page.wait_for_timeout(450)
                      assert page.locator("#kaioMeet").is_visible(),"No se abrio diálogo de llegada"
                      heading=page.locator("#kaioHeading").inner_text()
                      reward=page.locator("#kaioReward").inner_text()
                      assert f"{km} km" in reward,reward
                      visible=page.locator("#kaioImg").is_visible()
                      loaded=page.locator("#kaioImg").evaluate("(im)=>im.complete&&im.naturalWidth>0")
                      assert visible and loaded,"Ilustración de meta no cargada"
                      report["distancias"].append({"km":km,"dialog":heading,"reward":reward,"status":"OK"})
                      page.locator("#kaioClose").click()
                      page.locator("#menuAgain").click()
                      assert page.locator("#routeMenu").is_visible()
                  assert not report["console_errors"],str(report["console_errors"])
                  report["resultado"]="success"
              except Exception as exc:
                  report["resultado"]="failure"
                  report["error"]=str(exc)
                  report["traceback"]=traceback.format_exc()[-2500:]
                  page.screenshot(path=str(root/"error.jpg"),type="jpeg",quality=75)
                  raise
              finally:
                  (root/"reporte.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
                  print("TEST_RESULT",json.dumps(report,ensure_ascii=False))
                  browser.close()
          PY
      - name: Guardar capturas y diagnóstico sin tocar el juego
        if: always()
        run: |
          set -euo pipefail
          git add -- serpiente-cardio-tv/pruebas-mundos-finales/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capturas móviles de menú y llegadas de 5 10 15 y 20 km'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-mundos-finales
          path: serpiente-cardio-tv/pruebas-mundos-finales/
          if-no-files-found: warn
          retention-days: 7
