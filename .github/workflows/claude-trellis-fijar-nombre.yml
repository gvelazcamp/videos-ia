name: Claude TRELLIS - corregir nombre en GLB sin alterar modelo original

on:
  push:
    paths:
      - 'experimentos/claude-trellis-20261119/corregir-nombre.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir-placa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar solo librerías de edición geométrica
        run: python -m pip install --disable-pip-version-check 'trimesh>=4,<5' pillow rtree
      - name: Añadir una placa 3D con el nombre Claude en la superficie existente
        run: python experimentos/claude-trellis-20261119/corregir-nombre.py
      - name: Guardar solo nuevo GLB y metadatos, conservando el original
        shell: bash
        run: |
          set -euo pipefail
          git add -- experimentos/claude-trellis-20261119/claude-trellis-nombre-corregido.glb
          git add -- experimentos/claude-trellis-20261119/resultado-correccion.json
          if git diff --cached --quiet; then
            echo "No se produjo salida validada"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Claude TRELLIS: nombre correcto en geometría GLB, preservando original"
          git pull --rebase origin main
          git push origin HEAD:main
