name: TRELLIS - diagnostico de subida de PNG y galeria
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voltito-trellis-probar-subida-20261118.yml'
      - 'experimentos/voltito-trellis-prueba-20261118/probar_subida.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar_entradas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Instalar cliente gratuito Gradio
        run: python -m pip install --disable-pip-version-check 'gradio_client>=1.6,<3'
      - name: Probar subida sin intentar generar GLB
        run: python experimentos/voltito-trellis-prueba-20261118/probar_subida.py
