name: Charizard vs Gemini IA - video con poderes automaticos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/charizard-vs-gemini-01.yml"
      - "experimentos/charizard-vs-gemini-01/render.py"
      - "experimentos/charizard-vs-gemini-01/gemini-guardian.svg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charizard-vs-gemini-01
  cancel-in-progress: false

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar herramientas de render gratuitas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin
          python -m pip install --disable-pip-version-check -q "numpy>=1.26,<3" "Pillow>=10,<13"
      - name: Verificar codigo, ilustracion y voz originales
        run: |
          python -m py_compile experimentos/charizard-vs-gemini-01/render.py
          test -s experimentos/charizard-vs-gemini-01/gemini-guardian.svg
          test -s experimentos/charizard-vs-gemini-01/voz-gemini-charon.mp3
          ffprobe -v error -show_entries format=duration,size -of json experimentos/charizard-vs-gemini-01/voz-gemini-charon.mp3
      - name: Producir video epico con voces, ataques y seleccion automatica
        run: |
          python experimentos/charizard-vs-gemini-01/render.py \
            --voice experimentos/charizard-vs-gemini-01/voz-gemini-charon.mp3 \
            --output experimentos/charizard-vs-gemini-01/charizard-vs-gemini.mp4
      - name: Comprimir version para celular sin modificar version principal
        run: |
          ffmpeg -nostdin -y -hide_banner -loglevel error \
            -i experimentos/charizard-vs-gemini-01/charizard-vs-gemini.mp4 \
            -vf "scale=480:854:flags=lanczos,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 28 \
            -profile:v baseline -level 3.0 -r 24 \
            -c:a aac -ac 2 -b:a 112k -movflags +faststart \
            experimentos/charizard-vs-gemini-01/charizard-vs-gemini-movil.mp4
      - name: Verificar videos y compatibilidad
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          folder=Path("experimentos/charizard-vs-gemini-01")
          for name,w,h in [("charizard-vs-gemini.mp4",540,960),
                           ("charizard-vs-gemini-movil.mp4",480,854)]:
              file=folder/name
              data=json.loads(subprocess.check_output(
                  ["ffprobe","-v","error","-show_format","-show_streams","-of","json",str(file)]))
              duration=float(data["format"]["duration"])
              assert 70.0 <= duration <= 71.4, (name,duration)
              assert any(s.get("codec_type")=="audio" and s.get("codec_name")=="aac" for s in data["streams"])
              assert any(s.get("codec_type")=="video" and s.get("codec_name")=="h264" and s.get("width")==w and s.get("height")==h for s in data["streams"])
              assert file.stat().st_size>500000,(name,file.stat().st_size)
              print("VALIDADO",name,duration,file.stat().st_size)
          PY
      - name: Guardar nuevo proyecto sin tocar peleas anteriores
        run: |
          git add -- experimentos/charizard-vs-gemini-01/charizard-vs-gemini.mp4 \
                     experimentos/charizard-vs-gemini-01/charizard-vs-gemini-movil.mp4 \
                     experimentos/charizard-vs-gemini-01/assets/
          if git diff --cached --quiet; then
            echo "El video y los assets ya estaban actualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Charizard vs Gemini IA: video completo y version movil"
          git pull --rebase origin main
          git push origin HEAD:main
